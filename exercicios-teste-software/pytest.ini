# ========================================
# CONFIGURAÇÃO GLOBAL DO PYTEST
# ========================================

[tool:pytest]
# Diretórios onde procurar testes
testpaths = exercicio01 exercicio02 exercicio03 exercicio04 exercicio05

# Padrões de nomes de arquivos de teste
python_files = test_*.py *_test.py

# Padrões de nomes de classes de teste  
python_classes = Test* *Tests

# Padrões de nomes de funções de teste
python_functions = test_*

# =====================================
# MARCADORES PERSONALIZADOS
# =====================================
markers =
    login: Testes relacionados a funcionalidade de login
    api: Testes de API REST  
    web: Testes de interface web com Selenium
    crud: Testes de operações CRUD (Create, Read, Update, Delete)
    parametrize: Testes parametrizados com múltiplos cenários
    pom: Testes usando Page Object Model
    smoke: Testes de smoke (funcionalidades críticas)
    regression: Testes de regressão
    slow: Testes que demoram mais para executar
    integration: Testes de integração entre componentes
    email_validation: Testes específicos de validação de email
    password_validation: Testes específicos de validação de senha
    search: Testes de funcionalidade de busca
    performance: Testes de performance e tempo de resposta

# =====================================
# OPÇÕES DE EXECUÇÃO
# =====================================
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --durations=10
    --color=yes

# =====================================
# CONFIGURAÇÕES DE COLETA
# =====================================
# Arquivos/diretórios a ignorar durante coleta
collect_ignore = setup.py venv .venv htmlcov .pytest_cache __pycache__

# =====================================
# CONFIGURAÇÕES DE LOGS
# =====================================
# Habilitar logs no terminal durante execução
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# =====================================
# CONFIGURAÇÕES DE WARNINGS
# =====================================
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# =====================================
# CONFIGURAÇÕES PARA TESTES WEB
# =====================================  
# Timeout padrão para elementos web (usado em fixtures)
webdriver_timeout = 30
page_load_timeout = 30

# =====================================
# CONFIGURAÇÕES DE RELATÓRIOS
# =====================================
# Configurações para pytest-html
htmlpath = relatorio_execucao.html

# Configurações para arquivos temporários
tmp_path_retention_count = 3
tmp_path_retention_policy = "failed"

# =====================================
# CONFIGURAÇÕES DE PERFORMANCE
# =====================================
# Timeout para testes individuais (em segundos)
timeout = 300

# Número máximo de workers para execução paralela
# Usado com pytest-xdist: pytest -n auto
max_workers = 4